{% extends "layout.html" %}

{% block title %}
    Quote
{% endblock %}

{% block main %}
    <form action="/quote" method="post">
        <div class="mb-3">
            <label for="#symbol" class="form-label">Stock symbol:</label>
            <input autofocus required autocomplete="off" type="text" name="symbol" id="symbol" class="form-control mx-auto w-auto">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
{% endblock %}
